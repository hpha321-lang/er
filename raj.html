body{background:var(--bg);color:#fff;font-family:'Segoe UI',sans-serif;margin:0;user-select:none;position:relative;isolation:isolate;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-24px;z-index:-2;background:linear-gradient(rgba(5,5,5,.48),rgba(5,5,5,.72)),var(--photo) center/cover no-repeat};background-size:cover,48% auto;background-position:center center,center 72%
body::after{content:"";position:fixed;inset:0;z-index:-1;background:rgba(5,5,5,.28);pointer-events:none}
.header-container{text-align:center;padding:30px 10px}
.zigzag-name{
font-size:38px;font-weight:900;letter-spacing:5px;
text-shadow:2px 2px var(--danger),-2px -2px var(--neon),0 0 20px var(--neon);
animation:glitch 1.5s infinite
}
@keyframes glitch{
0%{transform:skew(0)}
20%{transform:skew(-3deg)}
40%{transform:skew(3deg)}
100%{transform:skew(0)}
}
.glass-box{
max-width:400px;margin:0 auto 20px;
background:rgba(255,255,255,.03);
border:1px solid rgba(0,255,65,.2);
border-radius:25px;padding:25px;
backdrop-filter:blur(15px);text-align:center
}
.pred-val{font-size:55px;font-weight:900;text-shadow:0 0 20px var(--neon)}.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 4px}.photo-tile{height:58px;border:1px solid rgba(0,255,65,.35);border-radius:10px;background-image:var(--photo);background-size:cover;background-position:center;box-shadow:0 0 10px rgba(0,255,65,.12)}
table{width:100%;margin-top:20px;border-collapse:collapse;font-size:11px}
th{color:#888;border-bottom:1px solid #222;padding:8px}
td{padding:10px;border-bottom:1px solid #111;text-align:center}
.win{color:var(--neon);font-weight:bold}
.loss{color:var(--danger);font-weight:bold}
.key-gate{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(5,5,5,.97)}
.key-card{width:min(360px,100%);padding:28px;border:1px solid rgba(0,255,65,.35);border-radius:22px;background:#0b0b0b;box-shadow:0 0 30px rgba(0,255,65,.12);text-align:center}
.key-card h2{margin:0 0 8px;color:var(--neon);letter-spacing:3px}
.key-card p{color:#888;font-size:13px;margin:0 0 18px}
.key-card input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #333;border-radius:10px;background:#111;color:#fff;text-align:center;outline:none}
.key-card button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;background:var(--neon);color:#050505;font-weight:800;cursor:pointer}
.key-error{height:18px;margin-top:10px;color:var(--danger);font-size:12px}
</style>
</head>

<body oncontextmenu="return false;">

<div class="key-gate" id="keyGate">
<div class="key-card">
<h2>𝐀𝐔𝐑𝐀 𝐗 𝐑𝐀𝐉</h2>
<p>Enter your access key to continue</p>
<input id="keyInput" type="password" placeholder="Access key" autocomplete="off">
<button id="keyButton" type="button">UNLOCK</button>
<div class="key-error" id="keyError"></div>
</div>
</div>

<div class="header-container">
<div class="zigzag-name">𝐀𝐔𝐑𝐀 𝐗 𝐑𝐀𝐉</div>
<div style="color:var(--gold);font-size:10px;letter-spacing:4px">𝐀𝐔𝐑𝐀 MOD V1</div>
</div>

<div class="glass-box">
<div style="color:#888;font-size:13px" id="pID">PERIOD: ---</div>
<div class="pred-val" id="pRes">WAIT...</div>
<div style="color:var(--gold);font-size:13px;border:1px dashed var(--gold);padding:8px" id="pOpps">
ANALYZING...
</div>

<div class="photo-grid"><div class="photo-tile"></div></div>

<table>
<thead>
<tr><th>PRD</th><th>PRED</th><th>NUM</th><th>STATUS</th></tr>
</thead>
<tbody id="logs"></tbody>
</table>
</div>

<script>
const ACCESS_KEY="RAJ1809";
const B_POOL=[5,6,7,8,9], S_POOL=[0,1,2,3,4];
let currentOpposites=[];

function unlock(){
const input=document.getElementById("keyInput");
const error=document.getElementById("keyError");
if(input.value===ACCESS_KEY){
document.getElementById("keyGate").style.display="none";
runLogic();
}else{
error.innerText="Invalid key. Try again.";
input.value="";
input.focus();
}
}

window.onload=()=>{
document.getElementById("keyButton").addEventListener("click",unlock);
document.getElementById("keyInput").addEventListener("keydown",e=>{
if(e.key==="Enter") unlock();
});
document.getElementById("keyInput").focus();
};

async function runLogic(){
setInterval(async()=>{
try{
const res=await fetch("https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json");
const json=await res.json();
const latest=json.data.list[0];

const last5=json.data.list.slice(0,5)
.map(x=>parseInt(x.number)>=5?"BIG":"SMALL");

const nextPred=last5.filter(x=>x==="BIG").length>2?"BIG":"SMALL";

if(window.lastId!==latest.issueNumber){
const num=parseInt(latest.number);
const size=num>=5?"BIG":"SMALL";
let lastPred=window.savedPrediction||nextPred;
let lastOpps=window.savedOpps||[];

if(window.lastId){
const win=(lastPred===size)||lastOpps.includes(num);
document.getElementById("logs").innerHTML=
`<tr>
<td>${latest.issueNumber.slice(-3)}</td>
<td>${lastPred}</td>
<td>${num}</td>
<td class="${win?'win':'loss'}">${win?'WIN 🐯':'LOSS 🖤'}</td>
</tr>`+document.getElementById("logs").innerHTML;
}

window.lastId=latest.issueNumber;
window.savedPrediction=nextPred;

const pool=nextPred==="BIG"?S_POOL:B_POOL;
currentOpposites=pool.sort(()=>0.5-Math.random()).slice(0,2);
window.savedOpps=currentOpposites;
}

document.getElementById("pID").innerText=
"PERIOD: "+(BigInt(latest.issueNumber)+1n);

document.getElementById("pRes").innerText=nextPred;
document.getElementById("pOpps").innerText=
"OPPOSITE NUMS: "+currentOpposites.join(", ");

}catch(e){}
},3000);
}
</script>

</body>
</html>
